

services:
  # --- Service Traefik (reverse proxy) ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"                # Dashboard accessible sur le port 8080 (dev uniquement)
      - "--providers.docker=true"            # Détection automatique des conteneurs Docker
      - "--entrypoints.web.address=:80"      # Entrée HTTP sur le port 80
    ports:
      - "80:80"                              # Port HTTP
      - "8080:8080"                          # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  # --- Backend (API Node.js / Express) ---
  backend:
    build: ./backend
    container_name: backend_container
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydatabase
      - NODE_ENV=development
      - PORT=5000
    expose:
      - "5000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)" # Les requêtes vers /api vont ici
      - "traefik.http.services.backend.loadbalancer.server.port=5000" # Port interne du backend
    networks:
      - app-network

  # --- Frontend (React App) ---
  frontend:
    build: ./frontend
    container_name: frontend_container
    depends_on:
      - backend
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)" # Le reste du trafic va au frontend
      - "traefik.http.services.frontend.loadbalancer.server.port=3000" # Port interne du frontend
    networks:
      - app-network

  # --- Base de données PostgreSQL ---
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

# --- Réseau interne Docker ---
networks:
  app-network:
    driver: bridge

# --- Volume persistant pour la base ---
volumes:
  postgres_data:
