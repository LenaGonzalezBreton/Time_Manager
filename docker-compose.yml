
services:
  # --- Service Traefik ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"  # Active le dashboard sur le port 8080 (à ne pas utiliser en prod)
      - "--providers.docker=true"  # Active la détection automatique des conteneurs Docker
      - "--entrypoints.web.address=:80"  # Déclare un point d’entrée HTTP
    ports:
      - "80:80"     # Port HTTP
      - "8080:8080" # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  # --- Backend ---
  backend:
    build: ./backend
    container_name: backend_container
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)" # Les requêtes vers /api vont ici
      - "traefik.http.services.backend.loadbalancer.server.port=5000" # Port interne du backend
    networks:
      - app-network

  # --- Frontend ---
  frontend:
    build: ./frontend
    container_name: frontend_container
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)" # Le reste du trafic va au frontend
      - "traefik.http.services.frontend.loadbalancer.server.port=3000" # Port interne du frontend
    networks:
      - app-network

  # --- Base de données PostgreSQL ---
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres_data:
