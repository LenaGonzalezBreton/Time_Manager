services:
  # --- Service Traefik (Ajout de la branche devops) ---
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--api.insecure=true"  # Active le dashboard sur le port 8080 (à ne pas utiliser en prod)
      - "--providers.docker=true"  # Active la détection automatique des conteneurs Docker
      - "--entrypoints.web.address=:80"  # Déclare un point d’entrée HTTP
    ports:
      - "80:80"      # Port HTTP
      - "8080:8080" # Dashboard Traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  # --- Base de données PostgreSQL (Version fusion-test : plus robuste) ---
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # --- Backend (Fusion des deux configurations) ---
  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "${API_PORT:-5000}:5000" # Accès direct possible (fusion-test)
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_PORT: ${API_PORT}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}
    depends_on:
      db:
        condition: service_healthy # Attend que la DB soit prête (fusion-test)
    labels: # Configuration Traefik (devops)
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"
    networks:
      - app-network

  # --- Frontend (Fusion des deux configurations) ---
  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - "${FRONTEND_PORT:-3000}:3000" # Accès direct possible (fusion-test)
    env_file:
      - ./.env
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    depends_on:
      - backend
    labels: # Configuration Traefik (devops)
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres_data:
    name: time_manager_postgres_data # Nom explicite conservé (fusion-test)